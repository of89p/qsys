<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Order Collection Queue</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                "colors": {
                    "surface-bright": "#383a37", "surface": "#121412", "background": "#121412",
                    "on-surface": "#e2e3df", "surface-container-high": "#292a28"
                },
                "fontFamily": {
                    "headline": ["Space Grotesk"], "display": ["Space Grotesk"], "body": ["Manrope"]
                }
            }
        }
    }
</script>
<style>
    body {
        background-color: #000000;
        color: #ffffff; margin: 0; padding: 0; height: 100vh;
        display: flex; flex-direction: column; overflow: hidden;
    }
    .text-giant { font-size: 8rem; line-height: 1.1; transition: all 0.3s ease; }
    .text-colossal { font-size: 12rem; line-height: 1; transition: all 0.3s ease; }
    .text-status-ready { color: #facc15; } /* Bright Yellow */
    .text-category-drinks { color: #3b82f6; } /* Bright Blue */
    .text-category-food { color: #b45309; } /* Brown */
</style>
</head>
<body class="font-display">
    <header class="w-full flex justify-center items-center h-32 md:h-40 shrink-0">
        <h1 class="text-7xl md:text-[5rem] font-bold text-on-surface uppercase tracking-tight">Order Collection</h1>
    </header>

    <main class="flex-1 w-full flex flex-row p-8 gap-12">
        <!-- Drinks Column -->
        <section class="flex-1 flex flex-col items-center">
            <div class="flex items-center gap-4 mb-8">
                <span class="material-symbols-outlined text-[4rem] text-category-drinks" style="font-variation-settings: 'FILL' 1;">local_cafe</span>
                <h2 class="text-5xl font-bold text-category-drinks tracking-tight whitespace-nowrap">Drinks and Snacks</h2>
            </div>
            <div id="drinks-container" class="flex flex-col items-center justify-around flex-1 w-full gap-4">
                <!-- Numbers will be injected here by JS -->
            </div>
        </section>

        <!-- Divider -->
        <div class="w-2 rounded-full bg-surface-container-high mx-4 my-8 opacity-50"></div>

        <!-- Food Column -->
        <section class="flex-1 flex flex-col items-center">
            <div class="flex items-center gap-4 mb-8">
                <span class="material-symbols-outlined text-[4rem] text-category-food" style="font-variation-settings: 'FILL' 1;">restaurant</span>
                <h2 class="text-5xl font-bold text-category-food tracking-tight whitespace-nowrap">Food</h2>
            </div>
            <div id="food-container" class="flex flex-col items-center justify-around flex-1 w-full gap-4">
                <!-- Numbers will be injected here by JS -->
            </div>
        </section>
    </main>

    <!-- Hidden Audio Element for the Ding -->
    <audio id="ding-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // Initial State
        let drinksQueue = ['142', '141', '139', '138'];
        let foodQueue = ['089', '088', '086', '085'];
        
        let inputBuffer = '';
        let currentTarget = 'FOOD'; // Defaults to Food
        const maxDisplay = 4;

        // Render functions
        function renderQueues() {
            const drinksContainer = document.getElementById('drinks-container');
            const foodContainer = document.getElementById('food-container');
            
            drinksContainer.innerHTML = drinksQueue.map((num, i) => generateNumberHTML(num, i)).join('');
            foodContainer.innerHTML = foodQueue.map((num, i) => generateNumberHTML(num, i)).join('');
        }

        function generateNumberHTML(num, index) {
            if (index === 0) {
                return `<div class="text-colossal font-bold text-status-ready tracking-tighter">${num}</div>`;
            } else {
                let opacity = index === 1 ? 'opacity-90' : index === 2 ? 'opacity-80' : 'opacity-70';
                return `<div class="text-giant font-bold text-on-surface tracking-tighter ${opacity}">${num}</div>`;
            }
        }

        // Logic to update the arrays safely
        function updateQueue(type, num) {
            let queue = type === 'DRINKS' ? drinksQueue : foodQueue;
            
            // If it exists, remove it so it can bump to the top
            queue = queue.filter(item => item !== num);
            
            // Add to the front
            queue.unshift(num);
            
            // Limit to 4 items
            if (queue.length > maxDisplay) queue.pop();
            
            // Reassign
            if (type === 'DRINKS') drinksQueue = queue;
            else foodQueue = queue;

            // Play Sound
            document.getElementById('ding-sound').play().catch(e => console.log("Audio play blocked by browser."));
            
            renderQueues();
        }

        // Keyboard Listener
        document.addEventListener('keydown', (e) => {
            // Ignore key presses if a modifier is held (like Ctrl+R to refresh)
            if (e.ctrlKey || e.altKey || e.metaKey) return;

            if (e.key >= '0' && e.key <= '9') {
                if (inputBuffer.length < 3) {
                    inputBuffer += e.key;
                }
            } else if (e.key.toLowerCase() === 'd') {
                currentTarget = 'DRINKS';
                inputBuffer = '';
            } else if (e.key.toLowerCase() === 'f') {
                currentTarget = 'FOOD';
                inputBuffer = '';
            } else if (e.key === 'Enter') {
                if (inputBuffer.length > 0) {
                    let paddedNumber = inputBuffer.padStart(3, '0');
                    updateQueue(currentTarget, paddedNumber);
                    inputBuffer = ''; // Clear buffer after submission
                }
            } else if (e.key === 'Backspace') {
                inputBuffer = inputBuffer.slice(0, -1);
            }
        });

        // Initial Render
        renderQueues();
    </script>
</body>
</html>
