<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Order Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: sans-serif;
        }
        /* Color Constraints */
        .text-ready { color: #facc15; } /* Bright Yellow */
        .header-drinks { color: #3b82f6; } /* Bright Blue */
        .header-food { color: #b45309; }   /* Brown */
        
        /* Typography Scaling */
        .num-new { font-size: 18rem; line-height: 1; font-weight: 800; }
        .num-past { font-size: 11rem; line-height: 1.1; color: #ffffff; font-weight: 700; opacity: 0.8; }
        
        /* Active Mode Indicator */
        .active-column { border-bottom: 8px solid white; padding-bottom: 10px; transition: all 0.2s; }
        .column-divider { width: 4px; background: #222; margin: 40px 0; }
    </style>
</head>
<body>

    <header class="w-full flex justify-center items-center h-40 shrink-0">
        <h1 class="text-7xl font-bold uppercase tracking-tighter">Order Collection</h1>
    </header>

    <main class="flex-1 w-full flex flex-row px-16 pb-12 gap-12">
        <!-- Drinks Column -->
        <section class="flex-1 flex flex-col items-center">
            <div id="drinks-header" class="mb-12">
                <h2 class="text-6xl font-black header-drinks uppercase tracking-tight">Drinks and Snacks</h2>
            </div>
            <div id="drinks-list" class="flex flex-col items-center justify-start gap-12 w-full">
                <!-- Numbers injected here -->
            </div>
        </section>

        <div class="column-divider"></div>

        <!-- Food Column -->
        <section class="flex-1 flex flex-col items-center">
            <div id="food-header" class="mb-12 active-column">
                <h2 class="text-6xl font-black header-food uppercase tracking-tight">Food</h2>
            </div>
            <div id="food-list" class="flex flex-col items-center justify-start gap-12 w-full">
                <!-- Numbers injected here -->
            </div>
        </section>
    </main>

    <!-- Notification Sound -->
    <audio id="ding" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <script>
        let drinks = [];
        let food = [];
        let buffer = "";
        let mode = "FOOD"; // Starting mode

        function render() {
            const dList = document.getElementById('drinks-list');
            const fList = document.getElementById('food-list');
            const dHead = document.getElementById('drinks-header');
            const fHead = document.getElementById('food-header');

            // Update Mode Visuals
            dHead.className = mode === "DRINKS" ? "mb-12 active-column" : "mb-12 opacity-40";
            fHead.className = mode === "FOOD" ? "mb-12 active-column" : "mb-12 opacity-40";

            // Render Numbers (Max 4)
            dList.innerHTML = drinks.map((n, i) => `<div class="${i===0 ? 'num-new text-ready' : 'num-past'}">${n}</div>`).join('');
            fList.innerHTML = food.map((n, i) => `<div class="${i===0 ? 'num-new text-ready' : 'num-past'}">${n}</div>`).join('');
        }

        window.addEventListener('keydown', e => {
            const key = e.key.toLowerCase();

            // Switch Mode
            if (key === 'd') { mode = "DRINKS"; render(); return; }
            if (key === 'f') { mode = "FOOD"; render(); return; }

            // Handle Numbers
            if (/[0-9]/.test(key)) {
                if (buffer.length < 3) buffer += key;
            }

            // Submit
            if (key === 'enter' && buffer.length > 0) {
                const finalNum = buffer.padStart(3, '0');
                let targetArr = mode === "DRINKS" ? drinks : food;

                // Unique Handling: Remove if exists to bump to top
                targetArr = targetArr.filter(n => n !== finalNum);
                targetArr.unshift(finalNum);

                // Limit history to 4
                if (targetArr.length > 4) targetArr.pop();

                // Save back
                if (mode === "DRINKS") drinks = targetArr; else food = targetArr;
                
                // Sound and Reset
                document.getElementById('ding').play().catch(() => {});
                buffer = "";
                render();
            }

            // Correction
            if (key === 'backspace') buffer = buffer.slice(0, -1);
        });

        // Initial render
        render();
    </script>
</body>
</html>
