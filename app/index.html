<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes latest-number-flash {
        0%,
        49% {
          color: #ff0000;
        }
        50%,
        100% {
          color: #facc15;
        }
      }

      .latest-number-flash {
        animation: latest-number-flash 1s steps(1, end) 10;
      }
    </style>
  </head>
  <body
    class="flex h-screen flex-col overflow-hidden bg-black font-sans text-white"
  >
    <!-- Changed min-h-screen to flex-1 so it leaves room for the footer -->
    <main class="flex flex-1 w-full flex-row gap-4 pt-8">
      <!-- Drinks Section -->
      <section class="flex-1 flex flex-col items-center">
        <div id="drinks-header" class="text-center mb-8">
          <div class="border-b-4">
            <h2
              class="text-8xl font-black uppercase tracking-tight text-yellow-400 pb-2"
            >
              Drinks/ Snacks
            </h2>
          </div>
        </div>
        <div
          id="drinks-list"
          class="flex flex-col items-center justify-start gap-8 w-full"
        ></div>
      </section>

      <div class="m-0 my-10 w-1 bg-[#ffffff]"></div>

      <!-- Chicken Rice Section -->
      <section class="flex-1 flex flex-col items-center w-full">
        <div id="chicken-header" class="text-center mb-8">
          <div class="border-b-4">
            <h2
              class="text-8xl font-black uppercase tracking-tight text-yellow-400 pb-2"
            >
              Chicken Rice
            </h2>
          </div>
        </div>
        <div
          id="chicken-list"
          class="flex flex-col items-center justify-start gap-8 w-full"
        ></div>
      </section>

      <div class="m-0 my-10 w-1 bg-[#ffffff]"></div>

      <!-- Others Section -->
      <section class="flex-1 flex flex-col items-center">
        <div id="food-header" class="text-center mb-8">
          <div class="border-b-4">
            <h2
              class="text-8xl font-black uppercase tracking-tight text-yellow-400 pb-2"
            >
              Other Food
            </h2>
          </div>
        </div>
        <div
          id="food-list"
          class="flex flex-col items-center justify-start gap-8 w-full"
        ></div>
      </section>
    </main>

    <!-- New Footer Section -->
    <footer class="w-full shrink-0 py-4 text-center text-3xl text-white">
      <p>Brought to you by QSys &bull; Contact us at 9660 4222</p>
    </footer>

    <script>
      ;(() => {
        const state = {
          drinks: [],
          chicken: [],
          food: [],
          mode: "FOOD",
          dingId: null,
          flashStation: null,
          flashDingId: null,
        }
        const DING_SOUND_URL = "/static/freesound_community-ding-dong-81717.mp3"
        const dingAudio = new Audio(DING_SOUND_URL)
        dingAudio.preload = "auto"

        // 1. RENDER FUNCTION (Updates the screen)
        function numberClass(station, index) {
          const isTopNumber = index === 0
          const isLatestCall =
            isTopNumber &&
            state.flashStation === station &&
            state.flashDingId === state.dingId
          const baseClass = isTopNumber
            ? "text-[200px] leading-none font-extrabold text-yellow-400"
            : "text-[200px] leading-[1.1] font-bold text-white opacity-80"

          return isLatestCall ? `${baseClass} latest-number-flash` : baseClass
        }

        function render() {
          const dList = document.getElementById("drinks-list")
          const cList = document.getElementById("chicken-list")
          const fList = document.getElementById("food-list")
          dList.innerHTML = state.drinks
            .map(
              (n, i) => `<div class="${numberClass("DRINKS", i)}">${n}</div>`,
            )
            .join("")
          cList.innerHTML = state.chicken
            .map(
              (n, i) => `<div class="${numberClass("CHICKEN", i)}">${n}</div>`,
            )
            .join("")
          fList.innerHTML = state.food
            .map((n, i) => `<div class="${numberClass("FOOD", i)}">${n}</div>`)
            .join("")
        }

        function playDing() {
          dingAudio.pause()
          try {
            dingAudio.currentTime = 0
          } catch (err) {
            console.error("Unable to rewind ding sound", err)
          }

          const playPromise = dingAudio.play()
          if (playPromise !== undefined) {
            playPromise.catch((err) => {
              console.error("Ding playback blocked", err)
            })
          }
        }

        // 2. VIEWER LOGIC: TV receives state updates from the Pi over SSE
        function applyState(data) {
          const dingId = data.ding_id ?? 0
          if (state.dingId !== null && dingId !== state.dingId) {
            playDing()
            state.flashStation = data.mode
            state.flashDingId = dingId
          }

          state.drinks = data.drinks
          state.chicken = data.chicken
          state.food = data.food
          state.mode = data.mode
          state.dingId = dingId
          render()
        }

        function connectStateStream() {
          const events = new EventSource("/api/events")

          events.addEventListener("state", (event) => {
            try {
              applyState(JSON.parse(event.data))
            } catch (err) {
              console.error("Invalid state event", err)
            }
          })

          events.onerror = () => {
            console.error("Waiting for server...")
          }
        }

        if (window.EventSource) {
          connectStateStream()
        } else {
          console.error("This browser does not support server-sent events.")
        }

        render()
      })()
    </script>
  </body>
</html>
