<!doctype html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Queue System</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex h-screen flex-col overflow-hidden bg-black font-sans text-white"
  >
    <header class="w-full flex justify-center items-center pt-4 shrink-0">
      <h1 class="text-4xl font-bold uppercase tracking-tighter">
        Order Collection
      </h1>
    </header>

    <!-- Changed min-h-screen to flex-1 so it leaves room for the footer -->
    <main class="flex flex-1 w-full flex-row gap-4 pt-8">
      <!-- Drinks Section -->
      <section class="flex-1 flex flex-col items-center">
        <div id="drinks-header" class="text-center mb-6">
          <h2 class="text-6xl font-black uppercase tracking-tight text-yellow-400">Drinks</h2>
        </div>
        <div id="drinks-list" class="flex flex-col items-center justify-start gap-6 w-full"></div>
      </section>

      <div class="m-0 my-10 w-1 bg-[#222]"></div>

      <!-- Chicken Rice Section -->
      <section class="flex-1 flex flex-col items-center">
        <div id="chicken-header" class="text-center mb-6">
          <h2 class="text-6xl font-black uppercase tracking-tight text-yellow-400">Chicken Rice</h2>
        </div>
        <div id="chicken-list" class="flex flex-col items-center justify-start gap-6 w-full"></div>
      </section>

      <div class="m-0 my-10 w-1 bg-[#222]"></div>

      <!-- Others Section -->
      <section class="flex-1 flex flex-col items-center">
        <div id="food-header" class="text-center mb-6">
          <h2 class="text-6xl font-black uppercase tracking-tight text-yellow-400">Others</h2>
        </div>
        <div id="food-list" class="flex flex-col items-center justify-start gap-6 w-full"></div>
      </section>
    </main>

    <!-- New Footer Section -->
    <footer class="w-full shrink-0 py-4 text-center text-sm text-white/50">
      <p>Made by company XYZ &bull; Contact us at [Insert Phone Number]</p>
    </footer>

    <!-- Notification Sound -->
    <button
      id="sound-enable"
      class="fixed bottom-6 right-6 z-10 block cursor-pointer rounded border-0 bg-white px-[22px] py-4 text-xl font-extrabold text-black"
      type="button"
    >
      Enable Sound
    </button>

    <script>
      ;(() => {
        // Dummy data for layout preview
        const state = {
          drinks: ["012", "015", "018"],
          chicken: ["042", "049"],
          food: ["088", "091", "095", "099"],
          mode: "FOOD",
          dingId: null,
        }
        const DING_CUTOFF_MS = 750
        const DING_CUTOFF_SECONDS = DING_CUTOFF_MS / 1000
        let audioContext = null
        let activeDingNodes = null
        let dingStopTimer = null
        let soundEnabled = true

        // 1. RENDER FUNCTION (Updates the screen)
        function render() {
          const dList = document.getElementById("drinks-list")
          const cList = document.getElementById("chicken-list")
          const fList = document.getElementById("food-list")
          dList.innerHTML = state.drinks
            .map(
              (n, i) =>
                `<div class="${i === 0 ? "text-9xl leading-none font-extrabold text-yellow-400" : "text-8xl leading-[1.1] font-bold text-white opacity-80"}">${n}</div>`,
            )
            .join("")
          cList.innerHTML = state.chicken
            .map(
              (n, i) =>
                `<div class="${i === 0 ? "text-9xl leading-none font-extrabold text-yellow-400" : "text-8xl leading-[1.1] font-bold text-white opacity-80"}">${n}</div>`,
            )
            .join("")
          fList.innerHTML = state.food
            .map(
              (n, i) =>
                `<div class="${i === 0 ? "text-9xl leading-none font-extrabold text-yellow-400" : "text-8xl leading-[1.1] font-bold text-white opacity-80"}">${n}</div>`,
            )
            .join("")
        }

        function playDing() {
          stopDing()

          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext
          if (!AudioContextClass) {
            showSoundEnable()
            console.error("AudioContext is not supported by this browser.")
            return
          }

          if (audioContext === null) {
            audioContext = new AudioContextClass()
          }

          const start = () => {
            hideSoundEnable()
            soundEnabled = true

            const now = audioContext.currentTime
            const gain = audioContext.createGain()
            const lowTone = audioContext.createOscillator()
            const highTone = audioContext.createOscillator()

            lowTone.type = "triangle"
            highTone.type = "sine"
            lowTone.frequency.setValueAtTime(880, now)
            highTone.frequency.setValueAtTime(1320, now)

            gain.gain.setValueAtTime(0.0001, now)
            gain.gain.exponentialRampToValueAtTime(0.7, now + 0.02)
            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              now + DING_CUTOFF_SECONDS,
            )

            lowTone.connect(gain)
            highTone.connect(gain)
            gain.connect(audioContext.destination)

            activeDingNodes = { lowTone, highTone, gain }
            lowTone.start(now)
            highTone.start(now)
            lowTone.stop(now + DING_CUTOFF_SECONDS)
            highTone.stop(now + DING_CUTOFF_SECONDS)
            dingStopTimer = setTimeout(stopDing, DING_CUTOFF_MS)
          }

          if (audioContext.state === "suspended") {
            audioContext
              .resume()
              .then(() => {
                if (audioContext.state !== "running") {
                  showSoundEnable()
                  console.error("Ding playback is still blocked.")
                  return
                }
                start()
              })
              .catch((err) => {
                showSoundEnable()
                console.error("Ding playback blocked", err)
              })
            return
          }

          start()
        }

        function stopDing() {
          if (dingStopTimer !== null) {
            clearTimeout(dingStopTimer)
            dingStopTimer = null
          }

          if (activeDingNodes !== null) {
            try {
              activeDingNodes.lowTone.stop()
              activeDingNodes.highTone.stop()
            } catch (err) {}
            activeDingNodes.lowTone.disconnect()
            activeDingNodes.highTone.disconnect()
            activeDingNodes.gain.disconnect()
            activeDingNodes = null
          }
        }

        function showSoundEnable() {
          document.getElementById("sound-enable").classList.remove("hidden")
        }

        function hideSoundEnable() {
          document.getElementById("sound-enable").classList.add("hidden")
        }

        document
          .getElementById("sound-enable")
          .addEventListener("click", () => {
            playDing()
          })

        // 2. VIEWER LOGIC: TV receives state updates from the Pi over SSE
        function applyState(data) {
          const dingId = data.ding_id ?? 0
          if (state.dingId !== null && dingId !== state.dingId) {
            if (true) {
              playDing()
            } else {
              showSoundEnable()
              console.error("Sound is not enabled yet.")
            }
          }

          state.drinks = data.drinks
          state.chicken = data.chicken
          state.food = data.food
          state.mode = data.mode
          state.dingId = dingId
          render()
        }

        function connectStateStream() {
          const events = new EventSource("/api/events")

          events.addEventListener("state", (event) => {
            try {
              applyState(JSON.parse(event.data))
            } catch (err) {
              console.error("Invalid state event", err)
            }
          })

          events.onerror = () => {
            console.error("Waiting for server...")
          }
        }

        if (window.EventSource) {
          connectStateStream()
        } else {
          console.error("This browser does not support server-sent events.")
        }

        render()
      })()
    </script>
  </body>
</html>
